<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4B7BE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGradient)"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="#FDBCB4" stroke="#E8A89C" stroke-width="2"/>

  <!-- Hair (white/gray) -->
  <path d="M 65 70 Q 65 35 100 30 Q 135 35 135 70 L 135 75 Q 100 80 65 75 Z" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="1"/>

  <!-- Eyes -->
  <circle cx="85" cy="65" r="4" fill="#2C3E50"/>
  <circle cx="115" cy="65" r="4" fill="#2C3E50"/>
  <circle cx="86" cy="64" r="1.5" fill="#fff"/>
  <circle cx="116" cy="64" r="1.5" fill="#fff"/>

  <!-- Smile -->
  <path d="M 85 80 Q 100 87 115 80" stroke="#8B6F47" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Wrinkles (age details) -->
  <path d="M 75 75 Q 80 78 85 75" stroke="#C4A080" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 115 75 Q 120 78 125 75" stroke="#C4A080" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Neck -->
  <rect x="90" y="102" width="20" height="15" fill="#FDBCB4"/>

  <!-- Shoulders/Body (clothing) -->
  <ellipse cx="100" cy="135" rx="45" ry="50" fill="#6B5B95" stroke="#4A3B73" stroke-width="2"/>

  <!-- Arms -->
  <ellipse cx="60" cy="125" rx="15" ry="40" fill="#FDBCB4" transform="rotate(-30 60 125)"/>
  <ellipse cx="140" cy="125" rx="15" ry="40" fill="#FDBCB4" transform="rotate(30 140 125)"/>

  <!-- Hands -->
  <circle cx="50" cy="160" r="10" fill="#FDBCB4"/>
  <circle cx="150" cy="160" r="10" fill="#FDBCB4"/>
</svg>

