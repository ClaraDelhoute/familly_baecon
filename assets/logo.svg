<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099FF;stop-opacity:0.4" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0099FF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0099FF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Aura glow -->
  <circle cx="100" cy="100" r="70" fill="url(#glowGradient)" />

  <!-- Beam left -->
  <path d="M 100 40 L 60 100 L 65 105 L 105 45 Z" fill="url(#beamGradient)" opacity="0.9" />

  <!-- Beam right -->
  <path d="M 100 40 L 140 100 L 135 105 L 95 45 Z" fill="url(#beamGradient)" opacity="0.9" />

  <!-- Beam down left -->
  <path d="M 100 100 L 50 160 L 56 162 L 106 105 Z" fill="url(#beamGradient)" opacity="0.7" />

  <!-- Beam down right -->
  <path d="M 100 100 L 150 160 L 144 162 L 94 105 Z" fill="url(#beamGradient)" opacity="0.7" />

  <!-- Tower base -->
  <rect x="85" y="130" width="30" height="20" fill="#003366" rx="2" />

  <!-- Tower main -->
  <rect x="82" y="70" width="36" height="65" fill="#FFFFFF" rx="3" />

  <!-- Tower lantern room -->
  <ellipse cx="100" cy="65" rx="20" ry="15" fill="#003366" />

  <!-- Lantern light -->
  <circle cx="100" cy="65" r="12" fill="#FFD700" opacity="0.9" />
  <circle cx="100" cy="65" r="8" fill="#FFFF00" opacity="1" />

  <!-- Tower door -->
  <rect x="96" y="95" width="8" height="12" fill="#8B4513" rx="1" />

  <!-- Tower window -->
  <circle cx="100" cy="82" r="3" fill="#87CEEB" />

  <!-- Ground/Base -->
  <ellipse cx="100" cy="160" rx="45" ry="12" fill="#10B981" opacity="0.8" />
  <ellipse cx="100" cy="160" rx="40" ry="9" fill="#34D399" opacity="0.9" />
</svg>

