<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4B7BE5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E88E5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGradient)"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="35" fill="#F5DEB3" stroke="#D4A574" stroke-width="2"/>

  <!-- Hair -->
  <path d="M 65 70 Q 65 35 100 30 Q 135 35 135 70" fill="#8B7355" stroke="#654321" stroke-width="1"/>

  <!-- Eyes -->
  <circle cx="85" cy="65" r="4" fill="#333"/>
  <circle cx="115" cy="65" r="4" fill="#333"/>
  <circle cx="86" cy="64" r="1.5" fill="#fff"/>
  <circle cx="116" cy="64" r="1.5" fill="#fff"/>

  <!-- Smile -->
  <path d="M 85 80 Q 100 88 115 80" stroke="#8B4513" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="90" y="102" width="20" height="15" fill="#F5DEB3"/>

  <!-- Shoulders/Body -->
  <ellipse cx="100" cy="135" rx="45" ry="50" fill="#4A7BA7" stroke="#2E5A87" stroke-width="2"/>

  <!-- Arms -->
  <ellipse cx="60" cy="125" rx="15" ry="40" fill="#F5DEB3" transform="rotate(-30 60 125)"/>
  <ellipse cx="140" cy="125" rx="15" ry="40" fill="#F5DEB3" transform="rotate(30 140 125)"/>
</svg>

