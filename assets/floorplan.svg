<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" style="background:#FFFFFF; font-family: 'Inter', Arial, sans-serif;">

  <!-- Background -->
  <rect width="420" height="680" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="210" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2">LOCALISATION EN TEMPS RÉEL</text>

  <!-- ── ROOMS ── -->

  <!-- Chambre (top-left) -->
  <rect x="30" y="52" width="170" height="180" rx="4" fill="#EEF4FF" stroke="#93C5FD" stroke-width="1.5"/>
  <!-- Label inside, top area, away from sensors -->
  <text x="115" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#3B82F6" letter-spacing="1.5">CHAMBRE</text>

  <!-- Salle de bain (top-right) -->
  <rect x="214" y="52" width="170" height="180" rx="4" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
  <text x="299" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#0891B2" letter-spacing="1.5">SALLE DE BAIN</text>

  <!-- Salon (large middle) -->
  <rect x="30" y="246" width="285" height="210" rx="4" fill="#FFF7ED" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="172" y="265" text-anchor="middle" font-size="9" font-weight="700" fill="#EA580C" letter-spacing="1.5">SALON</text>

  <!-- Couloir (right strip) -->
  <rect x="329" y="246" width="55" height="210" rx="4" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.5"/>
  <!-- Label centered vertically, rotated around strip center -->
  <text x="356" y="314" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="#6B7280" letter-spacing="1.5" transform="rotate(-90 356 314)">COULOIR</text>

  <!-- Cuisine (bottom) -->
  <rect x="30" y="470" width="200" height="165" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="130" y="489" text-anchor="middle" font-size="9" font-weight="700" fill="#15803D" letter-spacing="1.5">CUISINE</text>

  <!-- Outer wall -->
  <rect x="24" y="46" width="366" height="595" rx="6" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>

  <!-- ── INACTIVE SENSORS ── -->

  <!-- Chambre: placed in bottom half away from label -->
  <circle cx="90"  cy="175" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="170" cy="195" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Salle de bain -->
  <circle cx="330" cy="175" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Couloir: spaced vertically -->
  <circle cx="356" cy="278" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="356" cy="350" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="356" cy="425" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Salon: placed below label -->
  <circle cx="285" cy="310" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="235" cy="380" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="170" cy="315" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="65"  cy="310" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="65"  cy="390" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="195" cy="435" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Cuisine: placed below label -->
  <circle cx="75"  cy="565" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="170" cy="520" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <circle cx="190" cy="545" r="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- ── ACTIVE SENSOR (Chambre – M010) ── -->
  <circle cx="116" cy="145" r="22" fill="none" stroke="#3B82F6" stroke-width="1"   opacity="0.12"/>
  <circle cx="116" cy="145" r="15" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.28"/>
  <circle cx="116" cy="145" r="8"  fill="#3B82F6"/>
  <circle cx="116" cy="145" r="3"  fill="#FFFFFF"/>

  <!-- ── LEGEND ── -->
  <circle cx="30"  cy="658" r="6"  fill="#3B82F6"/>
  <text   x="42"   y="663" font-size="11" font-weight="500" fill="#334155">Capteur actif</text>

  <circle cx="160" cy="658" r="6"  fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text   x="172"  y="663" font-size="11" font-weight="500" fill="#334155">Capteur inactif</text>

</svg>

