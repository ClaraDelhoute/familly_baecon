<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D4BE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BFBFBF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond neutre -->
  <rect width="200" height="200" fill="#2C3E50" opacity="0.1"/>

  <!-- Cheveux (gris/blanc) -->
  <ellipse cx="100" cy="60" rx="42" ry="38" fill="url(#hairGradient)"/>
  <path d="M 58 65 Q 58 40 100 35 Q 142 40 142 65 L 142 70 Q 100 75 58 70 Z" fill="url(#hairGradient)"/>

  <!-- Tête/Visage -->
  <circle cx="100" cy="95" r="40" fill="url(#skinGradient)" stroke="#D4B896" stroke-width="1"/>

  <!-- Rides du front (subtiles) -->
  <path d="M 80 75 Q 100 70 120 75" stroke="#D4A574" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M 78 80 Q 100 76 122 80" stroke="#D4A574" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- Yeux -->
  <ellipse cx="82" cy="90" rx="6" ry="8" fill="#3D3D3D"/>
  <ellipse cx="118" cy="90" rx="6" ry="8" fill="#3D3D3D"/>

  <!-- Reflets yeux -->
  <circle cx="84" cy="88" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="120" cy="88" r="2" fill="#FFFFFF" opacity="0.8"/>

  <!-- Sourcils (gris) -->
  <path d="M 75 78 Q 82 76 89 78" stroke="#999999" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 111 78 Q 118 76 125 78" stroke="#999999" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Nez -->
  <path d="M 100 85 L 100 103 L 98 105" stroke="#D4A574" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Bouche (sourire bienveillant) -->
  <path d="M 85 115 Q 100 125 115 115" stroke="#8B5A3C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Rides autour des yeux (pattes d'oie) -->
  <path d="M 88 95 L 92 97" stroke="#D4A574" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
  <path d="M 87 93 L 91 94" stroke="#D4A574" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
  <path d="M 108 95 L 112 97" stroke="#D4A574" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
  <path d="M 109 93 L 113 94" stroke="#D4A574" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>

  <!-- Cou -->
  <rect x="90" y="133" width="20" height="18" fill="url(#skinGradient)" stroke="#D4B896" stroke-width="0.5"/>

  <!-- Chemise (blanc cassé/gris clair) -->
  <ellipse cx="100" cy="160" rx="50" ry="45" fill="#E8E8E8" stroke="#BFBFBF" stroke-width="1"/>

  <!-- Mains (visible) -->
  <ellipse cx="65" cy="155" rx="12" ry="28" fill="url(#skinGradient)" transform="rotate(-25 65 155)"/>
  <ellipse cx="135" cy="155" rx="12" ry="28" fill="url(#skinGradient)" transform="rotate(25 135 155)"/>

  <!-- Expression bienveillante -->
  <text x="100" y="185" font-size="10" text-anchor="middle" fill="#666666" opacity="0.5">Réné</text>
</svg>

